<title>Comet Cascade 2.4</title>

</head><body><canvas id="c"></canvas>
<script>
(function(){'use strict';
/* CHANGELOG
 1.0       Rename to Comet Cascade, graphics overhaul (cached sprites), blaster/laser via B/L pickups, strict touch pickups (no magnet), version constant.
 1.1       Restored Schnellfeuer, Breitschuss, Lenkraketen, Seitenkanonen, Plasma (pickups, stacking, ship growth).
 1.2 beta  Black-screen fix (invalid HSL->hex colors threw every frame), robust loop, context-loss handling, (debug LOG overlay removed in 1.8),
           Back/Escape returns to start screen; laser locked until first L pickup; all weapons reset each new game.
 1.3 beta  Round energy-bubble shield (concentric layers, fresnel rim, ripple ring), round HUD shield icons, ~40% more weapon drops (comets 17%, enemy ships 35%).
 1.4 beta  Drops 14% comets / 30% enemy ships; softer rounded shapes (ships, fortress, boss, pickups, HUD, bullets);
           memory: particle cap 250, sprite cache 120, sprite canvases max 1024px.
 1.5 beta  Visual polish: ship banking, neon pulse, canopy glint, afterburner, wing-tip trails; new fortress (layered plates, rivets,
           reactor, beacons, radar, shielded turrets, muzzle flash, damage states, multi-stage explosion); screen flash, hit blink,
           comet dust, pickup sparkle, level warp, vignette, drifting nebula glow.
 1.6 beta  Scrolling parallax background (nebula layers, stars, planet, space debris); Seitenkanonen removed;
           progressive difficulty curve (DF) with new enemy types (Pfeil, Kanonenboot); 4 fortress + 4 boss variants; fortress stops lower.
 1.7 beta  Planet: heavily blurred (downscale/upscale), darker, desaturated, no rim/bands, alpha .3, slower, smaller, partly off-screen.
 1.8 beta  6 new enemy types (Schwarm, Kamikaze, Sniper, Panzer, Minenleger+Minen, Splitter) introduced by level;
           shield hit costs 1 weapon level (lost upgrade drops, recatchable ~3 s, 'WEAPON LOST'); pity drops vs. death spiral; debug LOG feature removed (old key cleared); title text fits screen width; balancing via bot sim.
 2.0       Difficulty setting (Leicht/Normal/Schwer) in start menu, persisted (default Normal); multiplier table DIFFS; separate highscores
           per difficulty (old highscore migrated to Normal); difficulty shown on title + game over.
 2.1       Weapons -10% (S bonus, F, R, P, laser; base blaster unchanged); fortresses 'Bastion Wacht/Kreuzer/Zitadelle/Sichel';
           shield break: ALL weapons -1 level (one recatchable pickup for the highest lost); fortress HP +20%; spawns during fort/boss +15%.
 2.2       Level title card (number + theme) with calm phase; 7 themes per 3-level block (Stahl-Imperium, Graue Aliens,
           Space Insects, Mysterious Nebula, Cthulhu Kraken, Cyborg, Crystal) restyling bastions, bosses, enemies, shots, background;
           pause: Back/Escape/hidden -> start screen with CONTINUE / NEW GAME (confirm); difficulty applies to new games only.
 2.2.1     Back fix: hash guard entry '#play' pushed only inside real user gestures (pointerup/touchend/click/keydown),
           popstate + hashchange + Navigation API; Back in play pauses to title; hidden tab pauses without history change.
 2.3       English UI (weapon icons R=Rapid, S=Spread, M=Missiles, P=Plasma); realistic look: HD sprites (2x), material pass (key light, AO edges, rim light, grime, scratches, greebles,
           emissive windows, decals; chitin sheen / wet skin / crystal spec), lit comets with ion/dust tails, fireball explosions with embers,
           diffraction-spike stars, soft gas-cloud nebula wisps (replaced hard filament strokes). All visible text English. Mechanics/balance/themes unchanged.
 2.4       Bosses -15% normal fire rate; theme boss specials (telegraphed): Steel rail cannon, Grey tractor beam + abduction orbs,
           Insect acid cone + puddles, Nebula phasing ghost orbs, Kraken ink clouds + tentacle sweep, Cyborg laser grid + homing drones,
           Crystal splitting shards. Menacing bosses/bastions (darker palette, teeth, red-hot ports, glowing eyes, pulse, intro shake/flash).
           Themed normal enemies (saucers, insect drones, ghost wisps, kraken spawn, cyborg drones, crystal shards; same hitboxes).
           Laser fires 3-pulse bursts + pause (same avg DPS). High-contrast enemy shots (white core, dark ring, glow, pulse, larger).
*/
// GAME_VERSION: bump this on every release (e.g. '1.1'); title tag, start screen and game-over screen derive from it.
const GAME_VERSION='2.4',GAME_NAME='Comet Cascade '+GAME_VERSION;try{document.title=GAME_NAME;}catch(e){}
/* 1.8: debug log removed; errors are caught silently. Old log key is cleared once. */
try{localStorage.removeItem('cometcascade_log');}catch(e){}
function logError(){}
try{window.onerror=function(){return true;};}catch(e){}
try{window.addEventListener('unhandledrejection',e=>{try{e.preventDefault();}catch(_){}});}catch(e){}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
/* HD sprites: 3-arg drawImage uses the logical size */try{const _di=ctx.drawImage;ctx.drawImage=function(img,a,b){if(arguments.length===3&&img&&img._s)return _di.call(ctx,img,a,b,img.width,img.height);return _di.apply(ctx,arguments);};}catch(e){}
let W=360,H=640,DPR=1,U=1;
const R=Math.random,TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v;
let bg=null,stars=[],warp=[];
let lastSz='';function resize(){W=Math.max(240,window.innerWidth||0);H=Math.max(360,window.innerHeight||0);DPR=Math.min(2,window.devicePixelRatio||1);U=Math.min(W/360,H/640);
 const sz=W+'x'+H+'x'+DPR;if(sz===lastSz&&bg)return;lastSz=sz;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';if(S){S.ty=clamp(S.ty||H*.86,H*.45,H*.94);S.y=S.ty;S.tx=clamp(S.tx,0,W);}buildBg();}
/* ===== DIFFICULTY: multiplier table (Normal = exact 1.8 balance) =====
   ast: comet spawn interval (>1 = fewer comets) | spd: enemy+comet speed | bsp: enemy bullet speed | fire: enemy fire interval (>1 = slower)
   spawn: enemy spawn interval | hp: enemy/comet HP | inv: post-hit invulnerability (s) | sh0: start shields | shDrop: shield drop chance
   pitySh / pityW: seconds until guaranteed shield / weapon drop */
const DIFFS={
 leicht:{n:'Easy',c:'#7dff9a',ast:1.4,spd:.8,bsp:.8,fire:1.25,spawn:1.2,hp:.85,inv:2.0,sh0:2,shDrop:1.6,pitySh:8,pityW:15},
 normal:{n:'Normal',c:'#7ff3ff',ast:1,spd:1,bsp:1,fire:1,spawn:1,hp:1,inv:1.3,sh0:1,shDrop:1,pitySh:12,pityW:20},
 schwer:{n:'Hard',c:'#ff6a7a',ast:.85,spd:1.15,bsp:1.15,fire:.85,spawn:.85,hp:1.15,inv:1.0,sh0:1,shDrop:.55,pitySh:20,pityW:28}};
let diff='normal';/* default on first launch */try{const d=localStorage.getItem('cometcascade_diff');if(DIFFS[d])diff=d;}catch(e){}
function DIF(){const d=S&&S.diff||diff;return DIFFS[d]||DIFFS.normal;}
const HIK=d=>'cometcascade_hi_'+d;let his={leicht:0,normal:0,schwer:0};
try{for(const d in his)his[d]=+localStorage.getItem(HIK(d))||0;/* migrate old single highscore (and very old voiddrift_hi) to Normal */
 const old=Math.max(+localStorage.getItem('cometcascade_hi')||0,+localStorage.getItem('voiddrift_hi')||0);if(old>his.normal){his.normal=old;localStorage.setItem(HIK('normal'),String(old));}}catch(e){}
let hi=his[diff];
function saveHi(){}
function bumpHi(store){if(!S)return;const d=S.diff||diff,v=Math.floor(S.score);if(v>(his[d]||0)){his[d]=v;if(store)try{localStorage.setItem(HIK(d),String(v));}catch(e){}}hi=his[diff];}
function setDiff(d){if(!DIFFS[d])return;diff=d;hi=his[d]||0;try{localStorage.setItem('cometcascade_diff',d);}catch(e){}}
const WEAP=[{k:'rapid',n:'Rapid Fire',c:'#ffd23a',i:'R'},{k:'spread',n:'Spread Shot',c:'#ff7a2a',i:'S'},{k:'missile',n:'Homing Missiles',c:'#7dff5a',i:'M'},{k:'plasma',n:'Plasma',c:'#b07bff',i:'P'}];
const WC={};WEAP.forEach(w=>WC[w.k]=w);
let roarT=0,flashA=0,warpT=0,booms=[],clouds=[];
let state='title',S=null,time=0,shake=0,overT=0,banner=null,parts=[],waves=[],pops=[];
function newGame(){S={x:W/2,tx:W/2,y:H*.86,ty:H*.86,score:0,level:1,lt:0,phase:'run',flow:1,shield:DIFFS[diff].sh0,diff,calm:2.5,inv:1.5,blv:1,llv:0,rip:0,w:{rapid:0,spread:0,missile:0,plasma:0},fire:0,mfire:0,pfire:0,
 en:[],eb:[],pb:[],pick:[],bfire:0,lz:0,spawnA:.5,spawnS:2,combo:0,comboT:0,dead:false};
 parts=[];waves=[];pops=[];state='play';paused=false;confirmOpen=false;showCard();}
function showBanner(a,b){banner={a,b,t:2.4};}
const LEVEL_LEN=38,PICK_R=12;
function wcount(){let n=(S.blv-1)+S.llv;for(const k in S.w)n+=S.w[k];return n;}
function shipScale(){return Math.min(1.75,1+wcount()*.05);}/* ship grows with every weapon level */

function pr(){return U*11*Math.min(1.3,shipScale());}
function mkAst(x,y,vx,vy,r,side){const L=S.level;S.en.push({t:'ast',x,y,vx,vy,r,hp:Math.ceil((1.5+r/U*.1)*DF(L).hp),rot:R()*TAU,vr:(R()-.5)*2,hue:R()*360,cr:Array.from({length:4},()=>[R()*TAU,R()*.6,.15+R()*.2]),pts:20,side,hot:R()<.3});}
function DF(L){const d=DF0(L),m=DIF();d.spd*=m.spd;d.fire*=m.fire;d.bsp*=m.bsp;d.hp*=m.hp;d.spawn*=m.spawn;return d;}
function DF0(L){const n=Math.max(0,L-1);return{spd:Math.min(1.7,1+.08*n),fire:Math.max(.5,1-.055*n),bsp:Math.min(1.55,1+.055*n),hp:Math.min(3,1+.2*n),spawn:Math.max(.5,1-.055*n),dart:L>=4?Math.min(.3,.12+.03*(L-4)):0,heavy:L>=6?Math.min(.25,.1+.03*(L-6)):0,maxEn:Math.min(40,16+L*2)};}
function astSpeed(){return U*(110+R()*70)*DF(S.level).spd;}
function spawnAst(){const r=U*(14+R()*16+Math.min(10,S.level)),x=r+R()*(W-2*r),sp=astSpeed();
 const tx=R()<.3?S.x+(R()-.5)*W*.5:x+(R()-.5)*W*.3,t=(S.y+2*r)/sp;let vx=(tx-x)/t;vx=clamp(vx,-sp*.7,sp*.7);mkAst(x,-r,vx,sp,r,0);}
function spawnSideAst(){const r=U*(12+R()*14),sd=R()<.5?-1:1,a=(15+R()*25)*Math.PI/180,sp=astSpeed();
 mkAst(sd<0?-r:W+r,R()*H*.45,-sd*Math.sin(a)*sp,Math.cos(a)*sp,r,1);}
function spawnShip(x,y){const L=S.level,D=DF(L),bx=x!=null?x:W*(.08+R()*.84),q=R(),v=q<D.heavy?2:q<D.heavy+D.dart?1:0;S.en.push({t:'ship',v,x:bx,bx,y:y!=null?y:-20*U,r:U*(v===2?21:v===1?13:16),hp:4*D.hp*(v===2?2.4:v===1?.6:1),ph:R()*TAU,cd:1+R(),pts:v===2?150:v===1?90:60,hold:H*(v===1?.3+R()*.3:.08+R()*.5),life:0,amp:W*(v===1?.25+R()*.15:.1+R()*.25)});}
const FORTV=[{n:'Bastion Watch',a:'58,232,255',m:['#59606e','#2a2e38','#101218'],tur:[-.6,0,.6]},{n:'Bastion Cruiser',a:'255,150,50',m:['#6e5a48','#322a24','#130f0c'],tur:[-.8,-.3,.3,.8]},{n:'Bastion Citadel',a:'90,255,150',m:['#4e6858','#223028','#0c120e'],tur:[-.7,-.35,0,.35,.7]},{n:'Bastion Sickle',a:'255,80,200',m:['#64506e','#2c2236','#110c16'],tur:[-.5,.5]}];
function spawnFort(){shake=Math.max(shake,10);flashA=Math.max(flashA,.3);const L=S.level,hp=Math.round((55+L*22)*1.2),v=(L-1)%4,T=themeOf(L),F=T.fe?{n:'Bastion '+T.fe[(L-1)%3]}:FORTV[v];S.en.push({t:'fort',v,th:T,nm:F.n,x:W/2,y:-H*.15,r:W*.36,hh:U*50,hp,mhp:hp,lc:4,pts:500,tur:FORTV[v].tur.map(o=>({o,cd:1+R()*2}))});S.phase='fort';showBanner(F.n.toUpperCase(),'Destroy the fortress!');}
const BOSSV=[{n:'Dreadnought',a:'58,232,255',m:['#08090c','#1a1e25','#2c323c'],tur:[-.8,-.45,0,.45,.8]},{n:'Hydra',a:'255,60,90',m:['#0c0607','#2a1418','#40242a'],tur:[-.9,-.3,.3,.9]},{n:'Sun Crown',a:'255,190,60',m:['#0c0a05','#262014','#3e3422'],tur:[-.7,-.35,0,.35,.7]},{n:'Leviathan',a:'180,110,255',m:['#08060c','#1c1628','#2e2640'],tur:[-.85,-.55,-.25,.25,.55,.85]}];
function spawnBoss(){const L=S.level,hp=250+L*85,v=(Math.max(1,Math.floor(L/3))-1)%4,T=themeOf(L),B={n:T.boss||BOSSV[v].n,tur:BOSSV[v].tur};S.en.push({t:'boss',v,th:T,nm:B.n,x:W/2,y:-10,r:W*.5,hh:H*.46,hp,mhp:hp,cd:2.5,ph:0,mc:6,pts:5000,phase:1,tur:B.tur.map(o=>({o,cd:1+R()*2}))});S.phase='boss';shake=Math.max(shake,18);flashA=Math.max(flashA,.55);roarT=1.2;showBanner('BOSS: '+B.n.toUpperCase(),'The flight stops – fight!');}
/* ===== 2.4 theme boss special attacks (telegraphed hazards) ===== */
function haz(o){(S.haz=S.haz||[]).push(o);return o;}
function bossSpecial(e,dt){if(e.sp==null){e.sp=3.5;e.sc=0;}e.sp-=dt;if(e.sp>0)return;const id=(e.th||THEMES[0]).id,ph=e.phase,bx=e.x,by=e.y-8*U;e.sp=8.2-ph*1.1;e.sc++;const alt=e.sc%2;
 if(id==='imp'){haz({k:'rail',x:S.x,w:16*U,warn:1.15,act:.35,t:0});if(ph>=3)haz({k:'rail',x:Math.min(W*.92,Math.max(W*.08,S.x+(R()<.5?-1:1)*W*.32)),w:16*U,warn:1.4,act:.35,t:0});}
 else if(id==='alien'){if(alt||ph===1){haz({k:'tract',x:bx,w:W*.2,warn:.7,act:2.2,t:0});}else{for(let i=-1;i<=1;i++){const b=eShot(bx+i*W*.18,by,95,i*.25);b.big=1;b.c='#7dff9a';}}}
 else if(id==='bug'){const a=Math.atan2(S.x-bx,S.y-by);haz({k:'cone',x:bx,y:by,a,warn:.85,act:.05,t:0,fire:1});}
 else if(id==='fog'){const n=ph>=2?7:5;for(let i=0;i<n;i++){const b=eShot(bx,by,140,(i-(n-1)/2)*.28);b.gh=1;b.ph0=i*.9;b.c='#b8c4ff';}}
 else if(id==='kraken'){if(alt){for(let i=0;i<(ph>=2?2:1);i++)haz({k:'ink',x:W*(.2+R()*.6),y:H*(.32+R()*.3),r:W*.2,warn:0,act:4.5,t:0});}else{const side=S.x<W/2?0:1;haz({k:'sweep',y:S.y,side,h:20*U,warn:1.2,act:.45,t:0});}}
 else if(id==='cyb'){if(alt){const off=R()*W*.25;for(let i=0;i<4;i++)haz({k:'rail',x:off+W*.06+i*W*.27,w:6*U,warn:1.1,act:.3,t:0,grid:1});}else{for(let i=0;i<(ph>=2?5:4);i++){const b=eShot(bx+(i-1.5)*W*.15,by,130,(i-1.5)*.5);b.hm=1.6;b.c='#ff4040';}}}
 else if(id==='cry'){for(let i=-2;i<=2;i++){const b=eShot(bx,by,150,i*.3);b.spl=.75+R()*.2;b.c='#bff4ff';}}}
function updHaz(dt){roarT=Math.max(0,roarT-dt);if(!S.haz||!S.haz.length)return;const P=pr();
 for(const z of S.haz){z.t+=dt;const on=z.t>=z.warn&&z.t<z.warn+z.act;
  if(z.k==='rail'&&on&&Math.abs(S.x-z.x)<z.w+P*.6&&S.y>0){hurt();}
  if(z.k==='rail'&&z.t>=z.warn&&!z.fx){z.fx=1;shake=Math.max(shake,z.grid?4:9);burst(z.x,H*.6,'#ffffff',8,.8);}
  if(z.k==='tract'&&on){const d=z.x-S.x,pull=Math.sign(d)*Math.min(Math.abs(d),U*95*dt);S.x+=pull;if(isFinite(S.tx))S.tx+=pull;}
  if(z.k==='cone'&&z.t>=z.warn&&z.fire){z.fire=0;for(let i=-3;i<=3;i++){const b=eShot(z.x,z.y,190,z.a+i*.11);b.c='#c8ff30';}
   for(let i=0;i<3;i++){const dd=H*(.45+i*.13),a=z.a+(i-1)*.18;haz({k:'pud',x:z.x+Math.sin(a)*dd,y:z.y+Math.cos(a)*dd,r:20*U,warn:.6,act:2.2,t:0});}}
  if(z.k==='pud'&&on&&Math.hypot(S.x-z.x,S.y-z.y)<z.r+P*.5)hurt();
  if(z.k==='sweep'&&on){const x0=z.side?W*.38:0,x1=z.side?W:W*.62;if(Math.abs(S.y-z.y)<z.h+P*.5&&S.x>x0&&S.x<x1)hurt();}}
 S.haz=S.haz.filter(z=>z.t<z.warn+z.act+.3);if(S.haz.length>24)S.haz.splice(0,S.haz.length-24);}
function inkSpr(){return cached('ink',128,128,(g)=>{for(let i=0;i<9;i++){const x=64+Math.cos(i*2.4)*26*(i%3?1:.3),y=64+Math.sin(i*1.7)*24,r=30+(i%4)*7,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(6,2,14,.95)');gr.addColorStop(.6,'rgba(12,4,26,.75)');gr.addColorStop(1,'rgba(10,2,20,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);}});}
function drawHaz(layer){if(!S.haz||!S.haz.length)return;ctx.save();
 for(const z of S.haz){const w=z.t<z.warn,on=!w&&z.t<z.warn+z.act,fade=on?1:w?Math.min(1,z.t/z.warn):Math.max(0,1-(z.t-z.warn-z.act)/.3),bl=Math.floor(z.t*10)%2;
  if(layer===1){if(z.k==='ink'){const a=Math.min(1,z.t*2)*Math.min(1,(z.warn+z.act-z.t)/.8);if(a>0)spr(inkSpr(),z.x,z.y,z.r*2.4,Math.max(0,a));}continue;}
  if(z.k==='rail'){if(w){ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,${z.grid?60:120},60,${.08+.14*fade})`;ctx.fillRect(z.x-z.w,0,z.w*2,H);ctx.strokeStyle=`rgba(255,90,60,${bl?.85:.4})`;ctx.lineWidth=1.5*U;ctx.setLineDash([8*U,6*U]);ctx.beginPath();ctx.moveTo(z.x,0);ctx.lineTo(z.x,H);ctx.stroke();ctx.setLineDash([]);}
   else{ctx.globalCompositeOperation='lighter';const ww=z.w*(on?1:fade);ctx.fillStyle=z.grid?'rgba(255,40,40,.55)':'rgba(120,200,255,.5)';ctx.fillRect(z.x-ww*1.6,0,ww*3.2,H);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(z.x-ww*.45,0,ww*.9,H);}}
  else if(z.k==='tract'){ctx.globalCompositeOperation='lighter';const a=(w?.12*fade:.22)*(1+.3*Math.sin(time*9));const gr=ctx.createLinearGradient(z.x-z.w,0,z.x+z.w,0);gr.addColorStop(0,'rgba(80,255,140,0)');gr.addColorStop(.5,`rgba(120,255,160,${a})`);gr.addColorStop(1,'rgba(80,255,140,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(z.x-z.w*.25,0);ctx.lineTo(z.x+z.w*.25,0);ctx.lineTo(z.x+z.w*1.2,H);ctx.lineTo(z.x-z.w*1.2,H);ctx.fill();
   if(on)for(let i=0;i<5;i++){const yy=((time*160*U+i*H/5)%H);ctx.strokeStyle='rgba(160,255,190,.35)';ctx.lineWidth=2*U;ctx.beginPath();ctx.ellipse(z.x,H-yy,z.w*(.3+.9*(1-yy/H)),6*U,0,0,TAU);ctx.stroke();}}
  else if(z.k==='cone'&&w){ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(200,255,40,${(bl?.22:.1)*fade})`;ctx.beginPath();ctx.moveTo(z.x,z.y);for(const o of[-.4,.4])ctx.lineTo(z.x+Math.sin(z.a+o)*H,z.y+Math.cos(z.a+o)*H);ctx.fill();}
  else if(z.k==='pud'){ctx.globalCompositeOperation='source-over';if(w){ctx.strokeStyle=`rgba(200,255,40,${bl?.8:.35})`;ctx.lineWidth=2*U;ctx.setLineDash([4*U,4*U]);ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.stroke();ctx.setLineDash([]);}
